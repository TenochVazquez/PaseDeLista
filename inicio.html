<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pase de lista - Mi Aula</title>
<style>
    :root{
        --bg:#0f1724; --card:#0b1220; --accent:#7c3aed; --accent-2:#06b6d4;
        --ok:#16a34a; --abs:#ef4444; --late:#f59e0b; --glass: rgba(255,255,255,0.04);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;margin:0;background:
        radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent),
        radial-gradient(1000px 400px at 90% 90%, rgba(6,182,212,0.08), transparent),
        var(--bg); color:#e6eef8; overflow-x: hidden;}
    
    .wrap{max-width:1100px;margin:28px auto;padding:24px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);box-shadow:0 10px 30px rgba(2,6,23,0.6);}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between}
    h1{margin:0;font-size:20px;letter-spacing:0.2px}
    .controls{display:flex;gap:8px;align-items:center}
    input[type="date"], input.search, .modal-input{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:var(--glass);color:inherit;outline:none}
    
    button{background:linear-gradient(90deg,var(--accent),var(--accent-2));border:0;padding:8px 12px;color:white;border-radius:10px;cursor:pointer;font-weight:600;transition: opacity 0.2s}
    button:hover{opacity: 0.9}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit}
    button.danger{background: var(--abs)}
    button.edit{background: var(--glass); font-size: 10px; border: 1px solid rgba(255,255,255,0.1); margin-right: 4px;}

    .pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.03);display:flex;gap:8px;align-items:center;font-weight:600}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:18px}
    
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;border:1px solid rgba(255,255,255,0.03);position: relative;}
    .avatar{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px;flex-shrink:0}
    .meta{flex:1; min-width: 0;}
    .name{font-weight:700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    
    .status button{padding:6px 10px;border-radius:8px;border:0;background:rgba(255,255,255,0.03);color:inherit;cursor:pointer;font-weight:700;font-size:12px}
    .present{background:linear-gradient(90deg, rgba(22,163,74,0.14), rgba(22,163,74,0.06)) !important; border:1px solid rgba(22,163,74,0.18) !important; color:var(--ok)}
    .absent{background:linear-gradient(90deg, rgba(239,68,68,0.12), rgba(239,68,68,0.04)) !important; border:1px solid rgba(239,68,68,0.18) !important; color:var(--abs)}

    /* Modal Styles */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px);
        display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
        background: var(--card); border: 1px solid rgba(255,255,255,0.1);
        padding: 24px; border-radius: 16px; width: 90%; max-width: 400px;
    }
    .modal-overlay.active { display: flex; }
    .modal-input { width: 100%; box-sizing: border-box; margin-top: 10px; margin-bottom: 20px; }

    footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;}
    .user-info{font-size: 12px; color: var(--accent-2); font-weight: bold;}
</style>
</head>
<body>

<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3 style="margin-top:0">Editar Alumno</h3>
        <input type="text" id="editNameInput" class="modal-input">
        <div style="text-align:right; gap:8px; display:flex; justify-content:flex-end">
            <button class="ghost" onclick="closeModal()">Cancelar</button>
            <button id="saveEditBtn">Guardar Cambios</button>
        </div>
    </div>
</div>

<div class="wrap">
    <header>
        <div>
            <h1>Pase de Lista</h1>
            <div class="user-info" id="userDisplay">Cargando usuario...</div>
        </div>
        <div class="controls">
            <input type="date" id="dateMain">
            <button class="danger" id="logoutBtn" style="padding: 5px 10px; font-size: 12px;">Salir</button>
        </div>
    </header>

    <div class="summary" style="display:flex; gap:10px; margin-top:15px;">
        <div class="pill">Presentes: <strong id="countPresent">0</strong></div>
        <div class="pill">Ausentes: <strong id="countAbsent">0</strong></div>
    </div>

    <section style="margin-top:20px; display:flex; gap:10px;">
        <input class="add-name" id="newName" placeholder="Nombre del nuevo alumno..." style="background:var(--glass); border:1px solid rgba(255,255,255,0.1); color:white; padding:8px 12px; border-radius:10px; flex:1;">
        <button id="addBtn">+ Agregar</button>
    </section>

    <div class="grid" id="grid"></div>

    <footer>
        <div class="small" id="syncStatus" style="font-size: 12px; opacity: 0.6;">Iniciando...</div>
        <button id="export">📥 Descargar Reporte</button>
    </footer>
</div>

<script>
let students = [];
let editingId = null;

// Poner fecha de hoy por defecto
document.getElementById('dateMain').valueAsDate = new Date();

function render(){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    let p=0, a=0;

    students.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="avatar">${s.name[0].toUpperCase()}</div>
            <div class="meta">
                <div class="name">${s.name}</div>
                <div style="margin-top:4px">
                    <button class="edit" onclick="openEditModal('${s.id}', '${s.name}')">Editar</button>
                    <button class="edit" style="color:#ef4444" onclick="deleteStudent('${s.id}')">Borrar</button>
                </div>
            </div>
            <div class="status">
                <button class="${s.status === 'present' ? 'present' : ''}" onclick="updateStatus('${s.id}', 'present')">P</button>
                <button class="${s.status === 'absent' ? 'absent' : ''}" onclick="updateStatus('${s.id}', 'absent')">A</button>
            </div>
        `;
        grid.appendChild(card);
        if(s.status === 'present') p++; else a++;
    });
    document.getElementById('countPresent').textContent = p;
    document.getElementById('countAbsent').textContent = a;
}

// Funciones de Gestión
window.updateStatus = (id, newStatus) => {
    const student = students.find(s => s.id === id);
    if(student) {
        student.status = newStatus;
        save();
    }
};

window.deleteStudent = (id) => {
    if(confirm('¿Estás seguro de eliminar a este alumno?')) {
        students = students.filter(s => s.id !== id);
        save();
    }
};

window.openEditModal = (id, name) => {
    editingId = id;
    document.getElementById('editNameInput').value = name;
    document.getElementById('editModal').classList.add('active');
};

window.closeModal = () => {
    document.getElementById('editModal').classList.remove('active');
    editingId = null;
};

document.getElementById('saveEditBtn').onclick = () => {
    const newName = document.getElementById('editNameInput').value.trim();
    if(newName && editingId) {
        const student = students.find(s => s.id === editingId);
        if(student) student.name = newName;
        closeModal();
        save();
    }
};

function save(){
    render();
    if(window.saveToCloud) window.saveToCloud(students);
}

document.getElementById('addBtn').onclick = () => {
    const nameInput = document.getElementById('newName');
    if(!nameInput.value.trim()) return;
    students.unshift({id: crypto.randomUUID(), name: nameInput.value.trim(), status: 'absent'});
    nameInput.value = '';
    save();
};

// EXPORTAR CON FECHA Y MES
document.getElementById('export').onclick = () => {
    const dateVal = document.getElementById('dateMain').value;
    const fechaObj = new Date(dateVal + 'T00:00:00');
    const mesNombre = fechaObj.toLocaleString('es-ES', { month: 'long' });
    
    let csv = `Reporte de Asistencia\nFecha: ${dateVal}\nMes: ${mesNombre}\n\n`;
    csv += "Nombre del Alumno,Asistencia (P/A)\n";
    
    students.forEach(s => {
        const statusText = s.status === 'present' ? 'Presente' : 'Ausente';
        csv += `"${s.name}",${statusText}\n`;
    });

    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Asistencia_${dateVal}.csv`;
    link.click();
};
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyACWzBOnsbKBq9DUvylaLMvW0W61ZgHMww",
    authDomain: "pasedelista01.firebaseapp.com",
    projectId: "pasedelista01",
    storageBucket: "pasedelista01.firebasestorage.app",
    messagingSenderId: "756847621008",
    appId: "1:756847621008:web:0844ef25ee8c781aa1b915"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const statusEl = document.getElementById('syncStatus');
  const userDisplay = document.getElementById('userDisplay');
  let currentUid = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUid = user.uid;
      userDisplay.textContent = "Docente: " + user.email;
      
      onSnapshot(doc(db, "usuarios", user.uid), (docSnap) => {
        if (docSnap.exists()) {
          students = docSnap.data().alumnos || [];
          render();
          statusEl.textContent = "✔ Sincronizado";
        } else {
          statusEl.textContent = "Nueva lista";
        }
      });
    } else {
      window.location.href = 'index.html';
    }
  });

  window.saveToCloud = async (lista) => {
    if (!currentUid) return;
    try {
      await setDoc(doc(db, "usuarios", currentUid), { 
        alumnos: lista,
        ultimaActualizacion: new Date()
      });
      statusEl.textContent = "✔ Guardado";
    } catch (e) {
      statusEl.textContent = "❌ Error";
    }
  };

  document.getElementById('logoutBtn').onclick = () => {
    signOut(auth).then(() => { window.location.href = 'index.html'; });
  };
</script>
</body>
</html>
