<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pase de Lista Pro - Mi Aula</title>
    <style>
        :root{
            --bg:#0f1724; --card:#0b1220; --accent:#7c3aed; --accent-2:#06b6d4;
            --ok:#16a34a; --abs:#ef4444; --late:#f59e0b; --glass: rgba(255,255,255,0.04);
            font-family: Inter, system-ui, -apple-system, sans-serif;
        }
        html,body{height:100%;margin:0;background:
            radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent),
            radial-gradient(1000px 400px at 90% 90%, rgba(6,182,212,0.08), transparent),
            var(--bg); color:#e6eef8; overflow-x: hidden;}
        
        .wrap{max-width:1100px;margin:28px auto;padding:24px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);box-shadow:0 10px 30px rgba(2,6,23,0.6);}
        header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap: wrap;}
        h1{margin:0;font-size:20px;letter-spacing:0.2px}
        
        .controls{display:flex;gap:8px;align-items:center}
        input[type="date"], .search, .modal-input, .add-name{
            padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);
            background:var(--glass);color:inherit;outline:none;transition: 0.2s;
        }
        .search:focus, .add-name:focus{ border-color: var(--accent-2); background: rgba(255,255,255,0.08); }
        
        button{background:linear-gradient(90deg,var(--accent),var(--accent-2));border:0;padding:10px 16px;color:white;border-radius:10px;cursor:pointer;font-weight:600;transition: 0.2s}
        button:hover{opacity: 0.9; transform: translateY(-1px);}
        button.ghost{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:inherit}
        button.danger{background: var(--abs)}
        button.edit{background: var(--glass); font-size: 10px; border: 1px solid rgba(255,255,255,0.1); margin-right: 4px; padding: 5px 8px;}

        .pill{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,0.03);display:flex;gap:8px;align-items:center;font-weight:600;border: 1px solid rgba(255,255,255,0.05);}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:18px}
        
        .card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;border:1px solid rgba(255,255,255,0.03); transition: 0.3s;}
        .card:hover{border-color: rgba(255,255,255,0.1); transform: scale(1.01);}
        .avatar{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px;flex-shrink:0}
        .meta{flex:1; min-width: 0;}
        .name{font-weight:700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px;}
        
        .status button{padding:8px 12px;border-radius:8px;border:0;background:rgba(255,255,255,0.05);color:inherit;cursor:pointer;font-weight:700;font-size:13px}
        .present{background:linear-gradient(90deg, #16a34a, #22c55e) !important; color:white !important; box-shadow: 0 4px 12px rgba(22,163,74,0.3);}
        .absent{background:linear-gradient(90deg, #ef4444, #f87171) !important; color:white !important; box-shadow: 0 4px 12px rgba(239,68,68,0.3);}

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card); border: 1px solid rgba(255,255,255,0.1);
            padding: 24px; border-radius: 16px; width: 90%; max-width: 400px;
        }
        .modal-overlay.active { display: flex; }
        .modal-input { width: 100%; box-sizing: border-box; margin-top: 10px; margin-bottom: 20px; }

        footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;}
        .user-info{font-size: 12px; color: var(--accent-2); font-weight: bold;}
        
        /* Responsive adjustments */
        @media (max-width: 600px) {
            .controls-row { flex-direction: column; align-items: stretch !important; }
            .pill { font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3 style="margin-top:0">Editar Alumno</h3>
        <input type="text" id="editNameInput" class="modal-input">
        <div style="text-align:right; gap:8px; display:flex; justify-content:flex-end">
            <button class="ghost" onclick="closeModal()">Cancelar</button>
            <button id="saveEditBtn">Guardar Cambios</button>
        </div>
    </div>
</div>

<div class="wrap">
    <header>
        <div>
            <h1>Pase de Lista</h1>
            <div class="user-info" id="userDisplay">Cargando usuario...</div>
        </div>
        <div class="controls">
            <input type="date" id="dateMain">
            <button class="danger" id="logoutBtn" style="padding: 5px 10px; font-size: 12px;">Salir</button>
        </div>
    </header>

    <div class="controls-row" style="display:flex; gap:10px; margin-top:20px; align-items: center;">
        <input type="text" id="searchBar" class="search" placeholder="🔍 Buscar alumno..." style="flex:1">
        <button class="ghost" id="markAllBtn" title="Marcar todos como presentes">✅ Todos</button>
    </div>

    <div class="summary" style="display:flex; gap:10px; margin-top:15px;">
        <div class="pill">Presentes: <strong id="countPresent" style="color:var(--ok)">0</strong></div>
        <div class="pill">Ausentes: <strong id="countAbsent" style="color:var(--abs)">0</strong></div>
    </div>

    <section style="margin-top:20px; display:flex; gap:10px;">
        <input class="add-name" id="newName" placeholder="Nombre del nuevo alumno..." style="flex:1;">
        <button id="addBtn">+ Agregar</button>
    </section>

    <div class="grid" id="grid"></div>

    <footer>
        <div class="small" id="syncStatus" style="font-size: 12px; opacity: 0.6;">Iniciando...</div>
        <button id="export">📥 Descargar CSV</button>
    </footer>
</div>

<script>
let students = [];
let editingId = null;

// Poner fecha de hoy
document.getElementById('dateMain').valueAsDate = new Date();

function render(){
    const grid = document.getElementById('grid');
    const term = document.getElementById('searchBar').value.toLowerCase();
    grid.innerHTML = '';
    let p=0, a=0;

    students.forEach(s => {
        // Filtro de búsqueda
        if (term && !s.name.toLowerCase().includes(term)) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="avatar">${s.name[0].toUpperCase()}</div>
            <div class="meta">
                <div class="name">${s.name}</div>
                <div style="margin-top:4px">
                    <button class="edit" onclick="openEditModal('${s.id}', '${s.name}')">Editar</button>
                    <button class="edit" style="color:#ef4444" onclick="deleteStudent('${s.id}')">Borrar</button>
                </div>
            </div>
            <div class="status">
                <button class="${s.status === 'present' ? 'present' : ''}" onclick="updateStatus('${s.id}', 'present')">P</button>
                <button class="${s.status === 'absent' ? 'absent' : ''}" onclick="updateStatus('${s.id}', 'absent')">A</button>
            </div>
        `;
        grid.appendChild(card);
        if(s.status === 'present') p++; else a++;
    });
    
    // Contadores basados en la lista completa, no solo la filtrada
    const totalP = students.filter(s => s.status === 'present').length;
    const totalA = students.filter(s => s.status === 'absent').length;
    document.getElementById('countPresent').textContent = totalP;
    document.getElementById('countAbsent').textContent = totalA;
}

// BUSCADOR EN TIEMPO REAL
document.getElementById('searchBar').oninput = () => render();

// MARCAR TODOS COMO PRESENTES
document.getElementById('markAllBtn').onclick = () => {
    if(confirm('¿Marcar a todos los alumnos como presentes?')) {
        students.forEach(s => s.status = 'present');
        save();
    }
};

window.updateStatus = (id, newStatus) => {
    const student = students.find(s => s.id === id);
    if(student) {
        student.status = newStatus;
        save();
    }
};

window.deleteStudent = (id) => {
    if(confirm('¿Estás seguro de eliminar a este alumno?')) {
        students = students.filter(s => s.id !== id);
        save();
    }
};

window.openEditModal = (id, name) => {
    editingId = id;
    document.getElementById('editNameInput').value = name;
    document.getElementById('editModal').classList.add('active');
};

window.closeModal = () => {
    document.getElementById('editModal').classList.remove('active');
    editingId = null;
};

document.getElementById('saveEditBtn').onclick = () => {
    const newName = document.getElementById('editNameInput').value.trim();
    if(newName && editingId) {
        const student = students.find(s => s.id === editingId);
        if(student) student.name = newName;
        closeModal();
        save();
    }
};

function save(){
    render();
    if(window.saveToCloud) window.saveToCloud(students);
}

document.getElementById('addBtn').onclick = () => {
    const nameInput = document.getElementById('newName');
    if(!nameInput.value.trim()) return;
    students.unshift({id: crypto.randomUUID(), name: nameInput.value.trim(), status: 'absent'});
    nameInput.value = '';
    save();
};

document.getElementById('export').onclick = () => {
    const dateVal = document.getElementById('dateMain').value;
    let csv = `Reporte de Asistencia\nFecha: ${dateVal}\n\nNombre,Estado\n`;
    students.forEach(s => {
        csv += `"${s.name}",${s.status === 'present' ? 'Presente' : 'Ausente'}\n`;
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Asistencia_${dateVal}.csv`;
    link.click();
};
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyACWzBOnsbKBq9DUvylaLMvW0W61ZgHMww",
    authDomain: "pasedelista01.firebaseapp.com",
    projectId: "pasedelista01",
    storageBucket: "pasedelista01.firebasestorage.app",
    messagingSenderId: "756847621008",
    appId: "1:756847621008:web:0844ef25ee8c781aa1b915"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const statusEl = document.getElementById('syncStatus');
  const userDisplay = document.getElementById('userDisplay');
  let currentUid = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUid = user.uid;
      userDisplay.textContent = "Docente: " + user.email;
      
      onSnapshot(doc(db, "usuarios", user.uid), (docSnap) => {
        if (docSnap.exists()) {
          students = docSnap.data().alumnos || [];
          render();
          statusEl.textContent = "✔ Sincronizado";
        }
      });
    } else {
      window.location.href = 'index.html';
    }
  });

  window.saveToCloud = async (lista) => {
    if (!currentUid) return;
    try {
      // Guardamos la lista maestra de alumnos
      await setDoc(doc(db, "usuarios", currentUid), { 
        alumnos: lista,
        ultimaActualizacion: new Date()
      }, { merge: true });

      // Opcional: Guardar historial por fecha
      const hoy = document.getElementById('dateMain').value;
      await setDoc(doc(db, "usuarios", currentUid, "historial", hoy), {
        asistencia: lista,
        fecha: hoy
      });

      statusEl.textContent = "✔ Guardado";
    } catch (e) {
      statusEl.textContent = "❌ Error al sincronizar";
    }
  };

  document.getElementById('logoutBtn').onclick = () => {
    signOut(auth).then(() => { window.location.href = 'index.html'; });
  };
</script>
</body>
</html>
