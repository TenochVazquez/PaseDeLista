<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pase de Lista - Mi Aula</title>
    <style>
        :root{
            --bg:#0f1724; --card:#0b1220; --accent:#7c3aed; --accent-2:#06b6d4;
            --ok:#16a34a; --abs:#ef4444; --late:#f59e0b; --glass: rgba(255,255,255,0.04);
            font-family: Inter, system-ui, -apple-system, sans-serif;
        }
        html,body{height:100%;margin:0;background:
            radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent),
            radial-gradient(1000px 400px at 90% 90%, rgba(6,182,212,0.08), transparent),
            var(--bg); color:#e6eef8; overflow-x: hidden;}
        
        .wrap{max-width:1100px;margin:28px auto;padding:24px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);box-shadow:0 10px 30px rgba(2,6,23,0.6);}
        header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap: wrap;}
        h1{margin:0;font-size:20px;letter-spacing:0.2px}
        
        .controls{display:flex;gap:8px;align-items:center}
        input[type="date"], .search, .modal-input, .add-name{
            padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);
            background:var(--glass);color:white;outline:none;transition: 0.2s;
            box-sizing: border-box;
        }
        
        button{background:linear-gradient(90deg,var(--accent),var(--accent-2));border:0;padding:10px 16px;color:white;border-radius:10px;cursor:pointer;font-weight:600;transition: 0.2s}
        button:hover{opacity: 0.9; transform: translateY(-1px);}
        button.ghost{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:inherit}
        button.danger{background: var(--abs)}
        button.edit{background: var(--glass); font-size: 10px; border: 1px solid rgba(255,255,255,0.1); margin-right: 4px; padding: 5px 8px;}

        .pill{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,0.03);display:flex;gap:8px;align-items:center;font-weight:600;border: 1px solid rgba(255,255,255,0.05);}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:18px}
        
        .card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;border:1px solid rgba(255,255,255,0.03); transition: 0.3s;}
        .avatar{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px;flex-shrink:0}
        .meta{flex:1; min-width: 0;}
        .name{font-weight:700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px;}
        
        .status button{padding:8px 12px;border-radius:8px;border:0;background:rgba(255,255,255,0.05);color:inherit;cursor:pointer;font-weight:700;font-size:13px}
        .present{background:linear-gradient(90deg, #16a34a, #22c55e) !important; color:white !important;}
        .absent{background:linear-gradient(90deg, #ef4444, #f87171) !important; color:white !important;}

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card); padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; }

        footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;}
        .user-info{font-size: 12px; color: var(--accent-2); font-weight: bold;}
    </style>
</head>
<body>

<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3 style="margin-top:0">Editar Alumno</h3>
        <input type="text" id="editNameInput" class="modal-input">
        <div style="text-align:right; gap:8px; display:flex; justify-content:flex-end">
            <button class="ghost" onclick="closeModal()">Cancelar</button>
            <button id="saveEditBtn">Guardar Cambios</button>
        </div>
    </div>
</div>

<div class="wrap">
    <header>
        <div>
            <h1>Pase de Lista</h1>
            <div class="user-info" id="userDisplay">Cargando usuario...</div>
        </div>
        <div class="controls">
            <input type="date" id="dateMain">
            <button class="danger" id="logoutBtn" style="padding: 5px 10px; font-size: 12px;">Salir</button>
        </div>
    </header>

    <div style="display:flex; gap:10px; margin-top:20px; align-items: center;">
        <input type="text" id="searchBar" class="search" placeholder="🔍 Buscar alumno..." style="flex:1">
        <button class="ghost" id="markAllBtn">✅ Todos Presentes</button>
    </div>

    <div class="summary" style="display:flex; gap:10px; margin-top:15px;">
        <div class="pill">Presentes: <strong id="countPresent" style="color:var(--ok)">0</strong></div>
        <div class="pill">Ausentes: <strong id="countAbsent" style="color:var(--abs)">0</strong></div>
    </div>

    <section style="margin-top:20px; display:flex; gap:10px;">
        <input class="add-name" id="newName" placeholder="Nombre del nuevo alumno..." style="flex:1;">
        <button id="addBtn">Agregar</button>
    </section>

    <div class="grid" id="grid"></div>

    <footer>
        <div class="small" id="syncStatus" style="font-size: 12px; opacity: 0.6;">Conectando...</div>
        <button id="export">Exportar CSV</button>
    </footer>
</div>

<script>
    // Variables globales
    window.students = [];
    window.masterList = []; // Lista original de alumnos sin estados temporales
    let editingId = null;

    document.getElementById('dateMain').valueAsDate = new Date();

    window.render = () => {
        const grid = document.getElementById('grid');
        const term = document.getElementById('searchBar').value.toLowerCase();
        grid.innerHTML = '';
        
        window.students.forEach(s => {
            if (term && !s.name.toLowerCase().includes(term)) return;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="avatar">${s.name[0].toUpperCase()}</div>
                <div class="meta">
                    <div class="name">${s.name}</div>
                    <div style="margin-top:4px">
                        <button class="edit" onclick="openEditModal('${s.id}', '${s.name}')">Editar</button>
                        <button class="edit" style="color:#ef4444" onclick="deleteStudent('${s.id}')">Borrar</button>
                    </div>
                </div>
                <div class="status">
                    <button class="${s.status === 'present' ? 'present' : ''}" onclick="updateStatus('${s.id}', 'present')">P</button>
                    <button class="${s.status === 'absent' ? 'absent' : ''}" onclick="updateStatus('${s.id}', 'absent')">A</button>
                </div>`;
            grid.appendChild(card);
        });
        
        document.getElementById('countPresent').textContent = window.students.filter(s => s.status === 'present').length;
        document.getElementById('countAbsent').textContent = window.students.filter(s => s.status === 'absent').length;
    };

    document.getElementById('searchBar').oninput = () => window.render();

    document.getElementById('markAllBtn').onclick = () => {
        if(confirm('¿Marcar a todos como presentes?')) {
            window.students.forEach(s => s.status = 'present');
            save();
        }
    };

    window.updateStatus = (id, status) => {
        const s = window.students.find(x => x.id === id);
        if(s) { s.status = status; save(); }
    };

    window.deleteStudent = (id) => {
        if(confirm('¿Eliminar alumno?')) { 
            window.masterList = window.masterList.filter(x => x.id !== id);
            window.students = window.students.filter(x => x.id !== id); 
            // Guardamos la lista maestra actualizada en el perfil del usuario
            if(window.updateMasterList) window.updateMasterList(window.masterList);
            save(); 
        }
    };

    window.openEditModal = (id, name) => {
        editingId = id;
        document.getElementById('editNameInput').value = name;
        document.getElementById('editModal').classList.add('active');
    };

    window.closeModal = () => document.getElementById('editModal').classList.remove('active');

    document.getElementById('saveEditBtn').onclick = () => {
        const name = document.getElementById('editNameInput').value.trim();
        const s = window.students.find(x => x.id === editingId);
        const m = window.masterList.find(x => x.id === editingId);
        if(s && name) { 
            s.name = name; 
            if(m) m.name = name;
            if(window.updateMasterList) window.updateMasterList(window.masterList);
            closeModal(); 
            save(); 
        }
    };

    function save() {
        window.render();
        if(window.saveToCloud) window.saveToCloud(window.students);
    }

    document.getElementById('addBtn').onclick = () => {
        const inp = document.getElementById('newName');
        if(!inp.value.trim()) return;
        const newStudent = {id: crypto.randomUUID(), name: inp.value.trim(), status: 'absent'};
        window.masterList.unshift({id: newStudent.id, name: newStudent.name});
        window.students.unshift(newStudent);
        if(window.updateMasterList) window.updateMasterList(window.masterList);
        inp.value = '';
        save();
    };

    document.getElementById('export').onclick = () => {
        const dateVal = document.getElementById('dateMain').value;
        let csv = `Reporte de Asistencia\nFecha: ${dateVal}\n\nNombre,Estado\n`;
        window.students.forEach(s => {
            csv += `"${s.name}",${s.status === 'present' ? 'Presente' : 'Ausente'}\n`;
        });
        const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Asistencia_${dateVal}.csv`;
        link.click();
    };
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyACWzBOnsbKBq9DUvylaLMvW0W61ZgHMww",
        authDomain: "pasedelista01.firebaseapp.com",
        projectId: "pasedelista01",
        storageBucket: "pasedelista01.firebasestorage.app",
        messagingSenderId: "756847621008",
        appId: "1:756847621008:web:0844ef25ee8c781aa1b915"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUid = null;

    // --- FUNCIÓN CLAVE: Cargar Asistencia por Fecha ---
    async function cargarAsistenciaPorFecha() {
        if (!currentUid) return;
        const fechaSeleccionada = document.getElementById('dateMain').value;
        const statusEl = document.getElementById('syncStatus');
        
        try {
            const docRef = doc(db, "usuarios", currentUid, "asistencias", fechaSeleccionada);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                window.students = docSnap.data().lista || [];
                statusEl.textContent = "✔ Historial cargado";
            } else {
                // Si no hay datos, usamos la lista maestra y reseteamos estados
                window.students = window.masterList.map(s => ({ ...s, status: 'absent' }));
                statusEl.textContent = "⚪ Día sin registros";
            }
            window.render();
        } catch (e) {
            statusEl.textContent = "❌ Error al cargar";
        }
    }

    document.getElementById('dateMain').addEventListener('change', cargarAsistenciaPorFecha);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUid = user.uid;
            document.getElementById('userDisplay').textContent = "Docente: " + user.email;
            
            // Suscripción a la lista maestra de alumnos
            onSnapshot(doc(db, "usuarios", user.uid), (snap) => {
                if (snap.exists()) {
                    window.masterList = snap.data().alumnos || [];
                    cargarAsistenciaPorFecha(); // Cargamos el día actual tras obtener los alumnos
                }
            });
        } else {
            window.location.href = 'index.html';
        }
    });

    window.updateMasterList = async (nuevaListaMaestra) => {
        if (!currentUid) return;
        await setDoc(doc(db, "usuarios", currentUid), { 
            alumnos: nuevaListaMaestra,
            ultimaActualizacion: new Date()
        }, { merge: true });
    };

    window.saveToCloud = async (listaAsistenciaDelDia) => {
        if (!currentUid) return;
        const hoy = document.getElementById('dateMain').value;
        try {
            // Guardamos la asistencia específica de la fecha seleccionada
            await setDoc(doc(db, "usuarios", currentUid, "asistencias", hoy), {
                lista: listaAsistenciaDelDia,
                fecha: hoy
            });
            document.getElementById('syncStatus').textContent = "✔ Guardado en " + hoy + "";
        } catch (e) {
            document.getElementById('syncStatus').textContent = "❌ Error al guardar";
        }
    };

    document.getElementById('logoutBtn').onclick = () => {
        signOut(auth).then(() => window.location.href = 'index.html');
    };
</script>
</body>
</html>
