<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login - Pase de Lista</title>
<style>
    :root{
        --bg:#0f1724; --card:#0b1220; --accent:#7c3aed; --accent-2:#06b6d4;
        --glass: rgba(255,255,255,0.04);
        --abs:#ef4444;
        font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    html,body{
        height:100%; margin:0; 
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent),
                    radial-gradient(1000px 400px at 90% 90%, rgba(6,182,212,0.08), transparent), var(--bg); 
        color:#e6eef8;
    }
    .login-card {
        width: 100%; max-width: 400px; padding: 40px; border-radius: 20px;
        background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
        border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(2,6,23,0.8); text-align: center;
    }
    .logo-area {
        width: 70px; height: 70px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-radius: 15px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
        font-size: 32px; font-weight: bold; box-shadow: 0 10px 20px rgba(124,58,237,0.3);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { color: rgba(230,238,248,0.5); font-size: 14px; margin-bottom: 30px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    label { display: block; font-size: 13px; margin-bottom: 8px; color: rgba(230,238,248,0.8); }
    input {
        width: 100%; padding: 12px 16px; border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08); background: var(--glass);
        color: white; box-sizing: border-box; outline: none;
    }
    button {
        width: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border: 0; padding: 14px; color: white; border-radius: 12px;
        cursor: pointer; font-weight: 700; font-size: 16px; margin-top: 10px;
    }
    #errorMsg { color: var(--abs); font-size: 13px; margin-top: 15px; display: none; }
    .switch-mode { margin-top: 20px; font-size: 13px; color: var(--accent-2); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="login-card">
    <div class="logo-area">✔</div>
    <h1 id="title">Bienvenido</h1>
    <p id="subtitle">Identifícate para pasar lista</p>

    <form id="loginForm">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="userInput" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="passInput" placeholder="••••••••" required>
        </div>
        <button type="submit" id="submitBtn">Entrar al Aula</button>
        <div id="errorMsg"></div>
        <div class="switch-mode" id="toggleAuth">¿No tienes cuenta? Regístrate aquí</div>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyACWzBOnsbKBq9DUvylaLMvW0W61ZgHMww",
        authDomain: "pasedelista01.firebaseapp.com",
        projectId: "pasedelista01",
        storageBucket: "pasedelista01.firebasestorage.app",
        messagingSenderId: "756847621008",
        appId: "1:756847621008:web:0844ef25ee8c781aa1b915"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isLogin = true;
    const btn = document.getElementById('submitBtn');
    const toggle = document.getElementById('toggleAuth');
    const errorMsg = document.getElementById('errorMsg');

    toggle.onclick = () => {
        isLogin = !isLogin;
        document.getElementById('title').textContent = isLogin ? 'Bienvenido' : 'Crear Cuenta';
        btn.textContent = isLogin ? 'Entrar al Aula' : 'Registrar y Entrar';
        toggle.textContent = isLogin ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Inicia sesión';
    };

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('userInput').value;
        const pass = document.getElementById('passInput').value;
        errorMsg.style.display = 'none';

        try {
            if (isLogin) {
                await signInWithEmailAndPassword(auth, email, pass);
            } else {
                await createUserWithEmailAndPassword(auth, email, pass);
            }
            window.location.href = 'inicio.html';
        } catch (error) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = "Error: " + error.message;
        }
    });
</script>
</body>
</html>
